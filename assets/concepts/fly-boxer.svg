<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b7de0"/><stop offset="1" stop-color="#1b3f86"/>
    </linearGradient>
    <linearGradient id="glove" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4a3d"/><stop offset="1" stop-color="#b3121b"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#7a2020"/><stop offset="1" stop-color="#2a0606"/>
    </radialGradient>
    <g id="g">
      <!-- glove pointing up: mitt, thumb, white cuff -->
      <path d="M-30 18 C-38 -14 -30 -44 0 -48 C32 -50 40 -18 34 14 C30 30 18 36 0 36 C-16 36 -27 30 -30 18 Z" fill="url(#glove)"/>
      <path d="M-30 6 C-46 2 -48 -18 -36 -26 C-28 -30 -22 -20 -24 -8 Z" fill="#9e0f17"/>
      <path d="M-12 -38 C0 -44 16 -42 24 -34" stroke="#ff9a90" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.7"/>
      <rect x="-24" y="32" width="48" height="20" rx="5" fill="#f4f4f4"/>
    </g>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>

  <!-- wings -->
  <g fill="#ffffff" fill-opacity="0.32" stroke="#ffffff" stroke-opacity="0.75" stroke-width="5">
    <ellipse cx="160" cy="250" rx="100" ry="46" transform="rotate(-28 160 250)"/>
    <ellipse cx="352" cy="250" rx="100" ry="46" transform="rotate(28 352 250)"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="3" fill="none">
    <path d="M226 268 C190 260 140 250 92 226"/><path d="M286 268 C322 260 372 250 420 226"/>
  </g>

  <!-- legs -->
  <g stroke="#0c0c10" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M222 360 L180 400 L170 446"/><path d="M290 360 L332 400 L342 446"/>
    <path d="M228 320 L172 340 L146 392"/><path d="M284 320 L340 340 L366 392"/>
  </g>

  <!-- abdomen + thorax -->
  <ellipse cx="256" cy="345" rx="56" ry="74" fill="#0c0c10"/>
  <g stroke="#2a2a33" stroke-width="5" fill="none"><path d="M206 330 Q256 344 306 330"/><path d="M212 362 Q256 376 300 362"/></g>
  <ellipse cx="256" cy="262" rx="54" ry="46" fill="#14141a"/>

  <!-- arms up in a boxing guard -->
  <g stroke="#0c0c10" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M214 258 L170 300 L150 232"/><path d="M298 258 L342 300 L362 232"/>
  </g>

  <!-- head -->
  <circle cx="256" cy="186" r="44" fill="#0c0c10"/>
  <ellipse cx="228" cy="178" rx="26" ry="31" fill="url(#eye)"/>
  <ellipse cx="284" cy="178" rx="26" ry="31" fill="url(#eye)"/>
  <circle cx="220" cy="166" r="6" fill="#fff" opacity="0.85"/><circle cx="276" cy="166" r="6" fill="#fff" opacity="0.85"/>

  <!-- gloves (drawn last so they sit in front, near the face) -->
  <use href="#g" transform="translate(152 196) rotate(-12) scale(1.05)"/>
  <use href="#g" transform="translate(360 196) rotate(12) scale(-1.05 1.05)"/>
</svg>
