<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2e3b"/>
      <stop offset="1" stop-color="#14151b"/>
    </linearGradient>
    <linearGradient id="glove" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd257"/>
      <stop offset="1" stop-color="#f08a00"/>
    </linearGradient>
    <linearGradient id="thumb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffbe3a"/>
      <stop offset="1" stop-color="#d77200"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>

  <!-- Speed lines, parallel to the punch -->
  <g stroke="#ffd257" stroke-width="18" stroke-linecap="round" opacity="0.75">
    <line x1="66"  y1="318" x2="122" y2="262"/>
    <line x1="86"  y1="414" x2="164" y2="336"/>
    <line x1="190" y1="446" x2="246" y2="390"/>
  </g>

  <g transform="rotate(42 270 250) translate(14 0)">
    <!-- Cuff = a strip of film -->
    <rect x="192" y="316" width="132" height="116" rx="16" fill="#0d0d10" stroke="#f4f4f4" stroke-width="6"/>
    <g fill="#f4f4f4">
      <rect x="204" y="330" width="16" height="16" rx="3"/>
      <rect x="204" y="364" width="16" height="16" rx="3"/>
      <rect x="204" y="398" width="16" height="16" rx="3"/>
      <rect x="296" y="330" width="16" height="16" rx="3"/>
      <rect x="296" y="364" width="16" height="16" rx="3"/>
      <rect x="296" y="398" width="16" height="16" rx="3"/>
    </g>
    <rect x="232" y="332" width="52" height="34" rx="4" fill="#4a90e2"/>
    <rect x="232" y="378" width="52" height="34" rx="4" fill="#4a90e2" opacity="0.75"/>

    <!-- Mitt -->
    <path d="M198 330
             C182 286 168 236 174 186
             C182 118 230 76 290 76
             C356 76 400 122 398 194
             C396 252 372 298 332 330 Z"
          fill="url(#glove)"/>
    <!-- Thumb hugging the lower-left of the mitt -->
    <path d="M178 214
             C150 222 144 256 160 280
             C176 304 214 312 236 296
             C252 284 246 262 228 254
             C206 244 196 222 178 214 Z"
          fill="url(#thumb)"/>
    <path d="M182 230 C170 250 178 276 204 288" stroke="#b85f00" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.5"/>
    <!-- Knuckle highlight + lacing seam -->
    <path d="M222 120 C248 98 300 94 338 112" stroke="#fff1b8" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M300 150 C326 190 330 240 312 290" stroke="#c96f00" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.45"/>
  </g>
</svg>
