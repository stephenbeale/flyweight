<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2e3b"/>
      <stop offset="1" stop-color="#14151b"/>
    </linearGradient>
    <linearGradient id="glove" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd257"/>
      <stop offset="1" stop-color="#f08a00"/>
    </linearGradient>
    <linearGradient id="thumb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffbe3a"/>
      <stop offset="1" stop-color="#d77200"/>
    </linearGradient>
    <clipPath id="tile"><rect x="16" y="16" width="480" height="480" rx="104"/></clipPath>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>

  <!-- Film strip running across the tile, perpendicular to the punch -->
  <g clip-path="url(#tile)">
    <g transform="rotate(-48 256 256)">
      <rect x="-80" y="196" width="672" height="132" fill="#0b0b0e"/>
      <rect x="-80" y="196" width="672" height="132" fill="none" stroke="#3a3d4a" stroke-width="4"/>
      <g fill="#e9e9ee">
        <rect x="-60" y="206" width="20" height="16" rx="3"/><rect x="-20" y="206" width="20" height="16" rx="3"/>
        <rect x="20"  y="206" width="20" height="16" rx="3"/><rect x="60"  y="206" width="20" height="16" rx="3"/>
        <rect x="100" y="206" width="20" height="16" rx="3"/><rect x="140" y="206" width="20" height="16" rx="3"/>
        <rect x="180" y="206" width="20" height="16" rx="3"/><rect x="220" y="206" width="20" height="16" rx="3"/>
        <rect x="260" y="206" width="20" height="16" rx="3"/><rect x="300" y="206" width="20" height="16" rx="3"/>
        <rect x="340" y="206" width="20" height="16" rx="3"/><rect x="380" y="206" width="20" height="16" rx="3"/>
        <rect x="420" y="206" width="20" height="16" rx="3"/><rect x="460" y="206" width="20" height="16" rx="3"/>
        <rect x="500" y="206" width="20" height="16" rx="3"/><rect x="540" y="206" width="20" height="16" rx="3"/>
        <rect x="-60" y="302" width="20" height="16" rx="3"/><rect x="-20" y="302" width="20" height="16" rx="3"/>
        <rect x="20"  y="302" width="20" height="16" rx="3"/><rect x="60"  y="302" width="20" height="16" rx="3"/>
        <rect x="100" y="302" width="20" height="16" rx="3"/><rect x="140" y="302" width="20" height="16" rx="3"/>
        <rect x="180" y="302" width="20" height="16" rx="3"/><rect x="220" y="302" width="20" height="16" rx="3"/>
        <rect x="260" y="302" width="20" height="16" rx="3"/><rect x="300" y="302" width="20" height="16" rx="3"/>
        <rect x="340" y="302" width="20" height="16" rx="3"/><rect x="380" y="302" width="20" height="16" rx="3"/>
        <rect x="420" y="302" width="20" height="16" rx="3"/><rect x="460" y="302" width="20" height="16" rx="3"/>
        <rect x="500" y="302" width="20" height="16" rx="3"/><rect x="540" y="302" width="20" height="16" rx="3"/>
      </g>
      <g fill="#3d6fb0">
        <rect x="-44" y="232" width="96" height="60" rx="4"/>
        <rect x="64"  y="232" width="96" height="60" rx="4"/>
        <rect x="172" y="232" width="96" height="60" rx="4"/>
        <rect x="280" y="232" width="96" height="60" rx="4"/>
        <rect x="388" y="232" width="96" height="60" rx="4"/>
        <rect x="496" y="232" width="96" height="60" rx="4"/>
      </g>
    </g>
  </g>

  <!-- Speed lines -->
  <g stroke="#ffd257" stroke-width="18" stroke-linecap="round" opacity="0.8">
    <line x1="66"  y1="318" x2="122" y2="262"/>
    <line x1="86"  y1="414" x2="164" y2="336"/>
    <line x1="190" y1="446" x2="246" y2="390"/>
  </g>

  <g transform="rotate(42 270 250) translate(14 0)">
    <!-- Shadow so the glove lifts off the strip -->
    <path d="M198 330 C182 286 168 236 174 186 C182 118 230 76 290 76 C356 76 400 122 398 194 C396 252 372 298 332 330 Z"
          fill="#000" opacity="0.35" transform="translate(10 12)"/>
    <!-- Cuff: white wrap with gold band -->
    <rect x="196" y="316" width="124" height="112" rx="20" fill="#f4f4f4"/>
    <rect x="196" y="350" width="124" height="20" fill="#f08a00"/>
    <!-- Mitt -->
    <path d="M198 330 C182 286 168 236 174 186 C182 118 230 76 290 76 C356 76 400 122 398 194 C396 252 372 298 332 330 Z"
          fill="url(#glove)"/>
    <!-- Thumb -->
    <path d="M178 214 C150 222 144 256 160 280 C176 304 214 312 236 296 C252 284 246 262 228 254 C206 244 196 222 178 214 Z"
          fill="url(#thumb)"/>
    <path d="M182 230 C170 250 178 276 204 288" stroke="#b85f00" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M222 120 C248 98 300 94 338 112" stroke="#fff1b8" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M300 150 C326 190 330 240 312 290" stroke="#c96f00" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.45"/>
  </g>
</svg>
