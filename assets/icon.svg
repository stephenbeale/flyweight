<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="window" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b7de0"/>
      <stop offset="1" stop-color="#1b3f86"/>
    </linearGradient>
    <linearGradient id="glove" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd257"/>
      <stop offset="1" stop-color="#f08a00"/>
    </linearGradient>
    <linearGradient id="thumb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffbe3a"/>
      <stop offset="1" stop-color="#d77200"/>
    </linearGradient>
    <clipPath id="win"><rect x="104" y="40" width="304" height="432" rx="20"/></clipPath>
  </defs>

  <!-- Film stock -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="#111216"/>

  <!-- Sprocket holes, both edges -->
  <g fill="#e9e9ee">
    <rect x="46"  y="62"  width="34" height="44" rx="9"/>
    <rect x="46"  y="164" width="34" height="44" rx="9"/>
    <rect x="46"  y="266" width="34" height="44" rx="9"/>
    <rect x="46"  y="368" width="34" height="44" rx="9"/>
    <rect x="432" y="62"  width="34" height="44" rx="9"/>
    <rect x="432" y="164" width="34" height="44" rx="9"/>
    <rect x="432" y="266" width="34" height="44" rx="9"/>
    <rect x="432" y="368" width="34" height="44" rx="9"/>
  </g>

  <!-- The frame (picture window) -->
  <rect x="104" y="40" width="304" height="432" rx="20" fill="url(#window)"/>

  <g clip-path="url(#win)">
    <!-- Speed lines -->
    <g stroke="#ffffff" stroke-width="16" stroke-linecap="round" opacity="0.55">
      <line x1="122" y1="300" x2="170" y2="252"/>
      <line x1="132" y1="392" x2="200" y2="324"/>
      <line x1="210" y1="430" x2="258" y2="382"/>
    </g>

    <g transform="translate(256 248) rotate(38) scale(0.82) translate(-286 -252)">
      <!-- Shadow -->
      <path d="M198 330 C182 286 168 236 174 186 C182 118 230 76 290 76 C356 76 400 122 398 194 C396 252 372 298 332 330 Z"
            fill="#000" opacity="0.3" transform="translate(10 12)"/>
      <!-- Cuff -->
      <rect x="196" y="316" width="124" height="112" rx="20" fill="#f4f4f4"/>
      <rect x="196" y="350" width="124" height="20" fill="#f08a00"/>
      <!-- Mitt -->
      <path d="M198 330 C182 286 168 236 174 186 C182 118 230 76 290 76 C356 76 400 122 398 194 C396 252 372 298 332 330 Z"
            fill="url(#glove)"/>
      <!-- Thumb -->
      <path d="M178 214 C150 222 144 256 160 280 C176 304 214 312 236 296 C252 284 246 262 228 254 C206 244 196 222 178 214 Z"
            fill="url(#thumb)"/>
      <path d="M182 230 C170 250 178 276 204 288" stroke="#b85f00" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.5"/>
      <path d="M222 120 C248 98 300 94 338 112" stroke="#fff1b8" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.7"/>
      <path d="M300 150 C326 190 330 240 312 290" stroke="#c96f00" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.45"/>
    </g>
  </g>
</svg>
